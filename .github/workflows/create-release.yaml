name: CD - create release

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check-version.outputs.version_changed }}
      current_version: ${{ steps.get-current-version.outputs.current_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full commit history to be able to inspect previous commits/tags

      - name: Get current version
        id: get-current-version
        run: |
          current_version=$(grep '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo $current_version
          echo "current_version=$current_version" >> "$GITHUB_ENV"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
      - name: Get previous version
        id: get-previous-version
        run: |
          # If there is no previous commit (first commit), `HEAD~1` will fail.
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            previous_version=$(git show HEAD~1:Cargo.toml | grep '^version =' | sed 's/version = "\(.*\)"/\1/')
          else
            previous_version=""
          fi
          echo "$previous_version"
          echo "previous_version=$previous_version" >> "$GITHUB_ENV"
      - name: Check if version changed
        id: check-version
        run: |
          # Always treat as version changed if manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - treating as version changed"
          elif [ "$current_version" != "$previous_version" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs:
      - check-version
      - build-artifacts
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: imposer-binary
          path: target/release

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.current_version }}
          name: v${{ needs.check-version.outputs.current_version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            target/release/imposer
            release_artifacts/imposer-v${{ needs.check-version.outputs.current_version }}.tar.gz
            release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-src.tar.gz
            release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-bin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    needs:
      - check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Build release binary
        run: |
          cargo build --release --locked

      - name: Prepare release artifacts
        run: |
          set -euo pipefail
          version=${{ needs.check-version.outputs.current_version }}
          mkdir -p release_artifacts

          # Source tarball (Git snapshot)
          git archive --format=tar --prefix=imposer-v${version}/ HEAD | gzip > release_artifacts/imposer-v${version}.tar.gz
          # Compute checksums for the generated artifacts so PKGBUILDs can include them
          src_tar=release_artifacts/imposer-v${version}.tar.gz
          src_sum=$(sha256sum "${src_tar}" | cut -d' ' -f1)

          # Prepare AUR source package: PKGBUILD that builds from the shipped tarball
          aur_dir=$(mktemp -d)
          cat > ${aur_dir}/PKGBUILD <<'PKGBUILD'
          pkgname=imposer
          pkgver=REPLACE_VERSION
          pkgrel=1
          pkgdesc="Imposer - PDF imposition tool"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT' 'Apache-2.0')
          source=("imposer-v${pkgver}.tar.gz")
          sha256sums=("REPLACE_SRC_SUM")

          build() {
            cd "${pkgname}-${pkgver}"
            cargo build --release --locked
          }

          package() {
            install -Dm755 "target/release/imposer" "$pkgdir/usr/bin/imposer"
          }
          PKGBUILD

          # Replace placeholders with actual values
          sed -i "s/REPLACE_VERSION/${version}/g" ${aur_dir}/PKGBUILD
          sed -i "s/REPLACE_SRC_SUM/${src_sum}/g" ${aur_dir}/PKGBUILD

          # Create AUR source tarball that contains PKGBUILD and the upstream source tarball
          cp "${src_tar}" ${aur_dir}/
          (cd ${aur_dir} && tar -czf ${GITHUB_WORKSPACE}/release_artifacts/imposer-${version}-aur-src.tar.gz PKGBUILD imposer-v${version}.tar.gz)

          # Also prepare a simple -bin package tarball containing PKGBUILD that installs the provided binary
          bin_dir=$(mktemp -d)
          cp target/release/imposer ${bin_dir}/imposer-${version}-linux-x86_64
          bin_sum=$(sha256sum "${bin_dir}/imposer-${version}-linux-x86_64" | cut -d' ' -f1)

          cat > ${bin_dir}/PKGBUILD <<'PKGBUILD'
          pkgname=imposer-bin
          pkgver=REPLACE_VERSION
          pkgrel=1
          pkgdesc="Imposer (binary package) - PDF imposition tool"
          arch=('x86_64')
          url="https://github.com/${GITHUB_REPOSITORY}"
          license=('MIT' 'Apache-2.0')
          source=("imposer-${pkgver}-linux-x86_64")
          sha256sums=("REPLACE_BIN_SUM")

          package() {
            install -Dm755 "imposer-${pkgver}-linux-x86_64" "$pkgdir/usr/bin/imposer"
          }
          PKGBUILD

          sed -i "s/REPLACE_VERSION/${version}/g" ${bin_dir}/PKGBUILD
          sed -i "s/REPLACE_BIN_SUM/${bin_sum}/g" ${bin_dir}/PKGBUILD

          (cd ${bin_dir} && tar -czf ${GITHUB_WORKSPACE}/release_artifacts/imposer-${version}-aur-bin.tar.gz PKGBUILD imposer-${version}-linux-x86_64)

      - name: List release artifacts
        run: |
          ls -la release_artifacts || true

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: imposer-binary
          path: target/release/imposer

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts

  build-python-wheels-linux:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python --interpreter python3.9 python3.10 python3.11 python3.12
          sccache: 'true'
          manylinux: '2_28'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-python-wheels-macos:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels (macOS)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-python-wheels-windows:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels (Windows)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  build-python-sdist:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  push-to-crates-io:
    needs:
      - create-release
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true

  push-to-aur:
    needs:
      - check-version
      - create-release
      - build-artifacts
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          # Configure SSH config to use the key for aur.archlinux.org
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
          EOF
          chmod 600 ~/.ssh/config

      - name: Push source package to AUR
        run: |
          set -euo pipefail
          repo=imposer
          remote=ssh://aur@aur.archlinux.org/${repo}.git
          if git ls-remote "$remote" >/dev/null 2>&1; then
            git clone "$remote" aurrepo
            cd aurrepo
            git rm -rf . || true
          else
            mkdir aurrepo
            cd aurrepo
            git init
            git remote add origin "$remote"
          fi

          # Extract the AUR source bundle
          tar -xzf ../release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-src.tar.gz -C .

          # Generate .SRCINFO from PKGBUILD using makepkg (need non-root user)
          docker run --rm -v $PWD:/work -w /work archlinux:latest /bin/bash -lc "
            pacman -Sy --noconfirm base-devel >/dev/null 2>&1 || true
            pacman -Sy --noconfirm --needed base-devel
            useradd -m builder
            chown -R builder:builder /work
            sudo -u builder makepkg --printsrcinfo > .SRCINFO.tmp
            chown root:root .SRCINFO.tmp
            mv .SRCINFO.tmp .SRCINFO
          "

          git add .
          git -c user.name="imposer-bot" -c user.email="noreply@github.com" commit -m "Release v${{ needs.check-version.outputs.current_version }}" || true
          git push origin HEAD:master --force || true

      - name: Verify AUR packages locally (Arch docker)
        run: |
          set -euo pipefail
          # Use the extracted files from the previous step which are now in aurrepo/
          # But wait, the previous step pushed from aurrepo. Let's just use the artifact again to be clean.

          tmpdir=$(mktemp -d)
          tar -xzf release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-src.tar.gz -C $tmpdir

          # Use the official archlinux:latest image to run makepkg checks
          docker run --rm -v $tmpdir:/work -w /work archlinux:latest /bin/bash -lc "
            pacman -Sy --noconfirm base-devel namcap >/dev/null 2>&1 || true
            pacman -Sy --noconfirm --needed base-devel namcap
            useradd -m builder
            chown -R builder:builder /work
            sudo -u builder makepkg --printsrcinfo
            namcap PKGBUILD || true
          "

      - name: Push binary package to AUR
        run: |
          set -euo pipefail
          repo=imposer-bin
          remote=ssh://aur@aur.archlinux.org/${repo}.git
          if git ls-remote "$remote" >/dev/null 2>&1; then
            git clone "$remote" aurrepo-bin
            cd aurrepo-bin
            git rm -rf . || true
          else
            mkdir aurrepo-bin
            cd aurrepo-bin
            git init
            git remote add origin "$remote"
          fi

          # Extract the AUR binary bundle
          tar -xzf ../release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-bin.tar.gz -C .

          # Generate .SRCINFO from PKGBUILD using makepkg (need non-root user)
          docker run --rm -v $PWD:/work -w /work archlinux:latest /bin/bash -lc "
            pacman -Sy --noconfirm base-devel >/dev/null 2>&1 || true
            pacman -Sy --noconfirm --needed base-devel
            useradd -m builder
            chown -R builder:builder /work
            sudo -u builder makepkg --printsrcinfo > .SRCINFO.tmp
            chown root:root .SRCINFO.tmp
            mv .SRCINFO.tmp .SRCINFO
          "

          git add .
          git -c user.name="imposer-bot" -c user.email="noreply@github.com" commit -m "Release v${{ needs.check-version.outputs.current_version }}" || true
          git push origin HEAD:master --force || true

  publish-to-pypi:
    needs:
      - check-version
      - create-release
      - build-python-wheels-linux
      - build-python-wheels-macos
      - build-python-wheels-windows
      - build-python-sdist
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imposer
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la dist/
          echo "Total files: $(ls -1 dist/ | wc -l)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
