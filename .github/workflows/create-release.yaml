name: CD - create release

on:
  push:
    branches:
      - main
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check-version.outputs.version_changed }}
      current_version: ${{ steps.get-current-version.outputs.current_version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full commit history to be able to inspect previous commits/tags

      - name: Get current version
        id: get-current-version
        run: |
          current_version=$(grep '^version =' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo $current_version
          echo "current_version=$current_version" >> "$GITHUB_ENV"
          echo "current_version=$current_version" >> "$GITHUB_OUTPUT"
      - name: Get previous version
        id: get-previous-version
        run: |
          # If there is no previous commit (first commit), `HEAD~1` will fail.
          if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
            previous_version=$(git show HEAD~1:Cargo.toml | grep '^version =' | sed 's/version = "\(.*\)"/\1/')
          else
            previous_version=""
          fi
          echo "$previous_version"
          echo "previous_version=$previous_version" >> "$GITHUB_ENV"
      - name: Check if version changed
        id: check-version
        run: |
          # Always treat as version changed if manually triggered
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
            echo "Manual trigger - treating as version changed"
          elif [ "$current_version" != "$previous_version" ]; then
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs:
      - check-version
      - build-artifacts
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release binary
        uses: actions/download-artifact@v4
        with:
          name: imposer-binary
          path: target/release

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version.outputs.current_version }}
          name: v${{ needs.check-version.outputs.current_version }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            target/release/imposer
            release_artifacts/imposer-v${{ needs.check-version.outputs.current_version }}.tar.gz
            release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-src.tar.gz
            release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-bin.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-artifacts:
    needs:
      - check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          override: true

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-aur
        uses: taiki-e/install-action@v2
        with:
          tool: aur

      - name: Build release binary
        run: |
          cargo build --release --locked

      - name: Generate AUR package with cargo-aur
        run: |
          set -euo pipefail
          version=${{ needs.check-version.outputs.current_version }}
          mkdir -p release_artifacts

          # cargo-aur generates: PKGBUILD and imposer-{version}-x86_64.tar.gz
          cargo aur

          # Move the generated tarball to release_artifacts
          mv imposer-${version}-x86_64.tar.gz release_artifacts/

          # Also create source tarball for GitHub release
          git archive --format=tar --prefix=imposer-v${version}/ HEAD | gzip > release_artifacts/imposer-v${version}.tar.gz

          # For AUR source package: create modified PKGBUILD that builds from source
          src_dir=$(mktemp -d)

          # cargo-aur creates a -bin PKGBUILD, we need to modify it for source package
          # Extract info from cargo-aur generated PKGBUILD
          pkgdesc=$(grep '^pkgdesc=' PKGBUILD | cut -d'"' -f2)

          cat > ${src_dir}/PKGBUILD <<EOF
          pkgname=imposer
          pkgver=${version}
          pkgrel=1
          pkgdesc="${pkgdesc}"
          arch=('x86_64')
          url="https://github.com/joaommartins/imposer-rs"
          license=('MIT' 'Apache-2.0')
          makedepends=('cargo' 'rust')
          source=("imposer-v\${pkgver}.tar.gz::https://github.com/joaommartins/imposer-rs/archive/v\${pkgver}.tar.gz")
          sha256sums=('SKIP')

          build() {
            cd "imposer-rs-\${pkgver}"
            cargo build --release --locked
          }

          package() {
            cd "imposer-rs-\${pkgver}"
            install -Dm755 "target/release/imposer" "\$pkgdir/usr/bin/imposer"
          }
          EOF

          # Create AUR source package tarball
          cp release_artifacts/imposer-v${version}.tar.gz ${src_dir}/
          (cd ${src_dir} && tar -czf ${GITHUB_WORKSPACE}/release_artifacts/imposer-${version}-aur-src.tar.gz PKGBUILD)

          # For binary package: use cargo-aur generated PKGBUILD but add dependencies
          bin_dir=$(mktemp -d)

          # Modify the cargo-aur PKGBUILD: rename to imposer-bin and add depends
          awk '
            /^pkgname=/ { print "pkgname=imposer-bin"; next }
            /^arch=/ { print; print "depends=(\"glibc\" \"gcc-libs\")"; next }
            { print }
          ' PKGBUILD > ${bin_dir}/PKGBUILD

          # Extract the binary tarball and copy it
          tar -xzf release_artifacts/imposer-${version}-x86_64.tar.gz -C ${bin_dir}/

          # Create binary package tarball
          (cd ${bin_dir} && tar -czf ${GITHUB_WORKSPACE}/release_artifacts/imposer-${version}-aur-bin.tar.gz PKGBUILD imposer)

      - name: List release artifacts
        run: |
          ls -la release_artifacts || true

      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: imposer-binary
          path: target/release/imposer

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts

  build-python-wheels-linux:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels (manylinux)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python --interpreter python3.9 python3.10 python3.11 python3.12
          sccache: 'true'
          manylinux: '2_28'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  build-python-wheels-macos:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels (macOS)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  build-python-wheels-windows:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: windows-latest
    strategy:
      matrix:
        target: [x64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build wheels (Windows)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --features python
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  build-python-sdist:
    needs: check-version
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  push-to-crates-io:
    needs:
      - create-release
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }} || true

  push-to-aur:
    needs:
      - check-version
      - create-release
      - build-artifacts
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release_artifacts

      - name: Setup SSH for AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts

          # Configure SSH config to use the key for aur.archlinux.org
          cat >> ~/.ssh/config <<EOF
          Host aur.archlinux.org
            IdentityFile ~/.ssh/aur_key
            User aur
          EOF
          chmod 600 ~/.ssh/config

      - name: Push source package to AUR
        run: |
          set -euo pipefail
          repo=imposer
          remote=ssh://aur@aur.archlinux.org/${repo}.git
          if git ls-remote "$remote" >/dev/null 2>&1; then
            git clone "$remote" aurrepo
            cd aurrepo
            git rm -rf . || true
          else
            mkdir aurrepo
            cd aurrepo
            git init
            git remote add origin "$remote"
          fi

          # Extract the AUR source bundle (just PKGBUILD now)
          tar -xzf ../release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-src.tar.gz -C .

          # Generate .SRCINFO using a temp container
          cd ..
          mkdir -p srcinfo_temp
          cp aurrepo/PKGBUILD srcinfo_temp/
          docker run --rm -v $PWD/srcinfo_temp:/work -w /work archlinux:latest /bin/bash -lc "
            pacman -Sy --noconfirm base-devel >/dev/null 2>&1 || true
            pacman -Sy --noconfirm --needed base-devel
            useradd -m builder || true
            sudo -u builder makepkg --printsrcinfo
          " > aurrepo/.SRCINFO
          cd aurrepo

          git add .
          git -c user.name="imposer-bot" -c user.email="noreply@github.com" commit -m "Release v${{ needs.check-version.outputs.current_version }}" || true
          git push origin HEAD:master --force || true

      - name: Push binary package to AUR
        run: |
          set -euo pipefail
          repo=imposer-bin
          remote=ssh://aur@aur.archlinux.org/${repo}.git
          if git ls-remote "$remote" >/dev/null 2>&1; then
            git clone "$remote" aurrepo-bin
            cd aurrepo-bin
            git rm -rf . || true
          else
            mkdir aurrepo-bin
            cd aurrepo-bin
            git init
            git remote add origin "$remote"
          fi

          # Extract the AUR binary bundle
          tar -xzf ../release_artifacts/imposer-${{ needs.check-version.outputs.current_version }}-aur-bin.tar.gz -C .

          # Generate .SRCINFO using a temp container
          cd ..
          mkdir -p srcinfo_temp_bin
          cp aurrepo-bin/PKGBUILD aurrepo-bin/imposer srcinfo_temp_bin/
          docker run --rm -v $PWD/srcinfo_temp_bin:/work -w /work archlinux:latest /bin/bash -lc "
            pacman -Sy --noconfirm base-devel >/dev/null 2>&1 || true
            pacman -Sy --noconfirm --needed base-devel
            useradd -m builder || true
            sudo -u builder makepkg --printsrcinfo
          " > aurrepo-bin/.SRCINFO
          cd aurrepo-bin

          git add .
          git -c user.name="imposer-bot" -c user.email="noreply@github.com" commit -m "Release v${{ needs.check-version.outputs.current_version }}" || true
          git push origin HEAD:master --force || true

  publish-to-pypi:
    needs:
      - check-version
      - create-release
      - build-python-wheels-linux
      - build-python-wheels-macos
      - build-python-wheels-windows
      - build-python-sdist
    if: needs.check-version.outputs.version_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/imposer
    permissions:
      id-token: write  # Required for trusted publishing

    steps:
      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: |
          ls -la dist/
          echo "Total files: $(ls -1 dist/ | wc -l)"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true
